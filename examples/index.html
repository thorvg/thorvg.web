<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ThorVG Lottie Player</title>
    <meta name="description" content="A web lottie player using ThorVG as a renderer" />
    <!--
      Build the player package, then serve this repository over HTTP.
      This example uses WebGL with the Non-Lite Default bundle.
      The bundle includes SW, WebGL, and WebGPU renderers; select the renderer
      with renderConfig.renderer before initialization, as shown below.

      To use a smaller preset, replace this script's src with:
        ../packages/lottie-player/dist/sw/lottie-player.js       (CPU)
        ../packages/lottie-player/dist/gl/lottie-player.js       (WebGL)
        ../packages/lottie-player/dist/wg/lottie-player.js       (WebGPU)
        ../packages/lottie-player/dist/sw-lite/lottie-player.js  (CPU Lite)
        ../packages/lottie-player/dist/gl-lite/lottie-player.js  (WebGL Lite)
        ../packages/lottie-player/dist/wg-lite/lottie-player.js  (WebGPU Lite)
      Also change animation.wasmUrl below to the SAME preset directory.
      Load only ONE player bundle: they all register <lottie-player>.
      Presets fix the renderer; renderConfig.renderer cannot change it.

      Lite supports Lottie and PNG, but excludes JPG/WebP images, TTF fonts,
      and Expressions. This example uses a shape-only animation for Lite.
      The controls below use APIs shared by Default and all presets.
      save2gif() and save2png() are available only in the Default bundle.
    -->
    <script src="../packages/lottie-player/dist/lottie-player.js"></script>
  </head>
  <body>
    <div>
      <div>
        <button onclick="playAnimation()">Play</button>
        <button onclick="pauseAnimation()">Pause</button>
        <button onclick="stopAnimation()">Stop</button>
        <button onclick="createAnimation()">Create</button>
        <button onclick="destroyAnimation()">Destroy</button>
        <div>
          <label for="reverseCheckbox">Reverse</label>
          <input type="checkbox" id="reverseCheckbox" onchange="toggleReverse(event)">
        </div>
          
        <div>
          <label for="loopCheckbox">Loop</label>
          <input type="checkbox" id="loopCheckbox" onchange="toggleLoop(event)" checked>
        </div>
        
        <div>
          <label for="speedRange">Speed</label>
          <input type="range" id="speedRange" min="0.1" max="2" step="0.1" value="1" onchange="changeSpeed(this.value)">
        </div>
        
        <div>
          <label for="frameRange">Frame</label>
          <input type="range" id="frameRange" min="0" max="100" step="1" value="0" onchange="seekFrame(this.value)">
        </div>
      </div>

      <div class="lottie"></div>
    </div>
    <script>
      let animation;
      window.onload = function() {
        createAnimation();
      }

      function createAnimation() {
        if (animation) {
          alert('Animation already exists');
          return;
        }

        const lottie = document.querySelector('.lottie');
        animation = document.createElement('lottie-player');

        animation.autoPlay = true;
        animation.loop = true;
        animation.src = "./resources/coin.json";
        animation.style.width = "500px";
        animation.style.height = "500px";
        // Use WebGL by default; change to 'sw' (CPU) or 'wg' (WebGPU) if needed.
        // Set this before appendChild(), which starts player initialization.
        // GPU rendering requires browser/device support; WebGPU also requires
        // a secure context such as HTTPS or localhost.
        // With a preset bundle, omit this line; the bundle selects the renderer.
        animation.renderConfig = { renderer: 'gl' };

        // Match the script bundle above. For example, WebGL Lite uses:
        // animation.wasmUrl = "../packages/lottie-player/dist/gl-lite/thorvg.wasm";
        animation.wasmUrl = "../packages/lottie-player/dist/thorvg.wasm";

        lottie.appendChild(animation);

        animation = document.querySelector('lottie-player');
        const frameRange = document.querySelector('#frameRange');

        animation.addEventListener('frame', function(e) {
          frameRange.value = e.detail.frame / animation.totalFrame * 100;
        });
      }

      function pauseAnimation() {
        if (!animation) {
          alert('Animation is not created yet');
          return;
        }

        animation.pause();
      }

      function stopAnimation() {
        if (!animation) {
          alert('Animation is not created yet');
          return;
        }

        animation.stop();
      }

      function seekFrame(framePercentage) {
        if (!animation) {
          alert('Animation is not created yet');
          return;
        }

        animation.seek(animation.totalFrame * framePercentage / 100);
      }

      function destroyAnimation() {
        if (!animation) {
          alert('No animation to destroy');
          return;
        }

        animation.destroy();
        animation = undefined;
      }

      function playAnimation() {
        if (!animation) {
          alert('Animation is not created yet');
          return;
        }

        animation.play();
      }

      function toggleLoop(e) {
        if (!animation) {
          alert('Animation is not created yet');
          return;
        }

        animation.setLooping(e.target.checked);
        if (animation.currentState !== 'playing') {
          animation.play();
        }
      }

      function changeSpeed(speed) {
        if (!animation) {
          alert('Animation is not created yet');
          return;
        }

        animation.setSpeed(speed);
        if (animation.currentState !== 'playing') {
          animation.play();
        }
      }

      function toggleReverse(e) {
        if (!animation) {
          alert('Animation is not created yet');
          return;
        }

        animation.setDirection(e.target.checked ? -1 : 1);
        if (animation.currentState !== 'playing') {
          animation.play();
        }
      }

  </script>
  </body>
</html>
