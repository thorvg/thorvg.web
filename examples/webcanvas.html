<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ThorVG WebCanvas</title>
    <meta name="description" content="Render with @thorvg/webcanvas on the main thread" />
    <style>
      body { font-family: sans-serif; margin: 24px; }
      canvas { border: 1px solid #ccc; display: block; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h2>ThorVG WebCanvas</h2>

    <label for="renderer">Renderer</label>
    <select id="renderer">
      <option value="gl">WebGL (gl)</option>
      <option value="wg">WebGPU (wg)</option>
      <option value="sw">Software (sw)</option>
    </select>

    <canvas id="canvas" width="600" height="600"></canvas>

    <script type="module">
      import ThorVG from 'https://unpkg.com/@thorvg/webcanvas@latest/dist/webcanvas.esm.js';
      // import ThorVG from '../packages/webcanvas/dist/webcanvas.esm.js'; // for local build

      const select = document.querySelector('#renderer');
      const renderer = new URLSearchParams(location.search).get('renderer') || 'gl';
      select.value = renderer;
      select.onchange = () => { location.search = `?renderer=${select.value}`; };

      const canvas = document.querySelector('#canvas');
      const { width, height } = canvas;

      const TVG = await ThorVG.init({
        renderer,
        // locateFile: (path) => '../packages/webcanvas/dist/' + path.split('/').pop(), // for local build
      });

      const tvgCanvas = new TVG.Canvas(canvas, { width, height });

      const bg = new TVG.Shape();
      bg.appendRect(0, 0, width, height).fill(50, 50, 50);
      tvgCanvas.add(bg);

      const title = new TVG.Text();
      title.font('default').text('ThorVG WebCanvas').fontSize(48)
        .outline(2, 0, 0, 0).align(0.5, 0.5).translate(width / 2, 150);
      tvgCanvas.add(title);

      const spinner = new TVG.Text();
      spinner.font('default').text('Animated!').fontSize(32)
        .fill(255, 200, 100).align(0.5, 0.5);
      tvgCanvas.add(spinner);

      const wave = [...'WAVE EFFECT'].map((ch) => {
        const glyph = new TVG.Text();
        glyph.font('default').text(ch).fontSize(28).align(0.5, 0.5);
        tvgCanvas.add(glyph);
        return glyph;
      });

      let time = 0;
      const frame = () => {
        time += 0.05;

        title.fill(Math.sin(time) * 127 + 128, Math.sin(time + 2) * 127 + 128, Math.sin(time + 4) * 127 + 128);
        spinner.translate(width / 2, 280).rotate(time * 20);
        wave.forEach((glyph, i) => {
          const c = Math.sin(time + i * 0.3) * 127 + 128;
          glyph.fill(c, 150, 255 - c).translate(width / 2 - 150 + i * 30, 420 + Math.sin(time * 2 + i * 0.5) * 20);
        });

        tvgCanvas.update().render();
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
