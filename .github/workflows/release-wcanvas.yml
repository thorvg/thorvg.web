name: Release WebCanvas
on:
  push:
    tags:
      - 'webcanvas@*'

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build WebCanvas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.0
          actions-cache-folder: 'emsdk-cache'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip
          pip install meson==1.10.0

      - name: Verify build tools installation
        run: |
          emcc --version
          meson --version
          ninja --version

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build webcanvas
        working-directory: ./packages/webcanvas
        run: pnpm run build

      - name: Lint
        run: pnpm --filter @thorvg/webcanvas lint

      - name: Type check
        run: pnpm --filter @thorvg/webcanvas typecheck

      - name: Run unit tests
        run: pnpm --filter @thorvg/webcanvas test

      - name: Install Browser tools for Playwright
        run: |
          sudo apt-get install -y xvfb
          pnpm --filter @thorvg/webcanvas exec playwright install --with-deps chromium

      - name: Run browser tests (WebGL)
        run: xvfb-run pnpm --filter @thorvg/webcanvas test:gl

      - name: Run browser tests (WebGPU)
        run: pnpm --filter @thorvg/webcanvas test:wg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-webcanvas-${{ github.run_id }}
          path: packages/webcanvas/dist/
          retention-days: 1

  validate:
    needs: build
    name: Validate Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-webcanvas-${{ github.run_id }}
          path: packages/webcanvas/dist/

      - name: Validate with dry-run publish
        working-directory: ./packages/webcanvas
        run: pnpm publish --dry-run --access public --no-git-checks

      - name: Create package tarball
        working-directory: ./packages/webcanvas
        run: pnpm pack

      - name: Verify tarball contents
        working-directory: ./packages/webcanvas
        run: |
          tar -tzf *.tgz
          echo "Package size:"
          ls -lh *.tgz

  npm-release:
    name: Release to npm Registry
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-webcanvas-${{ github.run_id }}
          path: packages/webcanvas/dist/

      - name: Update npm
        run: npm install -g npm@latest

      - name: Stage publish to npm
        working-directory: ./packages/webcanvas
        run: npm stage publish --access public

  gpr-release:
    name: Release to GitHub Packages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@thorvg'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-webcanvas-${{ github.run_id }}
          path: packages/webcanvas/dist/

      - name: Publish to GitHub Packages
        working-directory: ./packages/webcanvas
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docs:
    name: Build API Documentation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-webcanvas-${{ github.run_id }}
          path: packages/webcanvas/dist/

      - name: Generate API Documentation
        working-directory: ./packages/webcanvas
        run: pnpm run docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './packages/webcanvas/docs'

  deploy-docs:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
