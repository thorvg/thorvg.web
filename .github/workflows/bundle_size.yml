name: Bundle Size

on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'wasm/**'
      - 'thorvg'
      - 'pnpm-lock.yaml'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.package }} (${{ matrix.ref }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'external' || '' }}
    strategy:
      matrix:
        package: [lottie-player, webcanvas]
        ref: [main, pr]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout PR merge commit
        if: matrix.ref == 'pr'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --depth=1 origin "refs/pull/$PR/merge"
          git checkout FETCH_HEAD
          git checkout "$GITHUB_SHA" -- .github/scripts/bundle-size.mjs
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0
          actions-cache-folder: 'emsdk-cache'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip
          pip install meson==1.10.0

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and measure
        env:
          PACKAGE: ${{ matrix.package }}
          REF: ${{ matrix.ref }}
        run: |
          pnpm --filter "@thorvg/$PACKAGE" build
          node .github/scripts/bundle-size.mjs measure "$PACKAGE" "$REF" ci-report

      - name: Upload sizes
        uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.package }}-${{ matrix.ref }}
          path: ci-report/

  report:
    name: Report
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download sizes
        uses: actions/download-artifact@v4
        with:
          path: ci-report
          pattern: size-*
          merge-multiple: true

      - name: Render report
        run: node .github/scripts/bundle-size.mjs report ci-report > report.md

      - name: Create or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const header = '## Bundle Size Report';
            const body = fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.findLast((c) =>
              c.user?.login === 'github-actions[bot]' && c.body?.includes(header));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated ${existing.html_url}`);
            } else {
              const res = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created ${res.data.html_url}`);
            }
