name: Bundle Size Comment

on:
  workflow_run:
    workflows: ["Bundle Size"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The report script is taken from the default branch, never from the PR,
      # since this job runs with write permissions.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download size artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-report
          pattern: size-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render report
        run: node .github/scripts/bundle-size.mjs report ci-report > report.md

      - name: Create or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportHeader = '## Bundle Size Report';
            const body = fs.readFileSync('report.md', 'utf8');

            // Resolve the PR number from workflow metadata, with a head
            // owner/branch lookup fallback so fork PRs are handled too.
            const workflowRun = context.payload.workflow_run;

            // Return the PR number from workflow_run.pull_requests when it is uniquely present.
            function extractPayloadPrNumber() {
              const prs = Array.isArray(workflowRun.pull_requests) ? workflowRun.pull_requests : [];
              const numbers = prs
                .map(pr => Number(pr.number))
                .filter(n => Number.isInteger(n) && n > 0);
              return numbers.length === 1 ? numbers[0] : null;
            }

            // Look up the open PR number by matching the workflow run's head owner and branch.
            async function lookupPrNumberByHeadBranch() {
              const headOwner = workflowRun.head_repository?.owner?.login;
              const headBranch = workflowRun.head_branch;

              if (!headOwner || !headBranch) {
                return null;
              }

              const response = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${headOwner}:${headBranch}`,
                per_page: 10,
              });

              const prs = response.data;
              if (prs.length === 1) return prs[0].number;
              return null;
            }

            let prNumber = extractPayloadPrNumber();
            if (!prNumber) {
              prNumber = await lookupPrNumberByHeadBranch();
            }

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(
                `Could not resolve a unique PR number for workflow run ${workflowRun.id} ` +
                `(head=${workflowRun.head_repository?.full_name || 'unknown'}:${workflowRun.head_branch || 'unknown'})`
              );
              return;
            }

            core.info(`Resolved PR number: #${prNumber}`);

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existingComments = comments.filter(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.user?.type === 'Bot' &&
              comment.body?.includes(reportHeader)
            );

            const existingComment = existingComments.at(-1);
            core.info(`Found ${existingComments.length} matching bundle size comment(s).`);
            core.info(`Selected comment id: ${existingComment?.id ?? 'none'}`);

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              core.info(`Updated bundle size comment: ${existingComment.html_url}`);
            } else {
              const response = await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              core.info(`Created bundle size comment: ${response.data.html_url}`);
            }
