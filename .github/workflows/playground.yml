name: Playground
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLAYGROUND_PROJECT_ID }}
on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'packages/webcanvas/**'
      - 'apps/playground/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/playground.yml'
      - '!**/*.md'
      - '!packages/webcanvas/test/**'

jobs:
  preview-playground:
    name: Preview Playground
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'external' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          allow-unsafe-pr-checkout: true # fork PRs require reviewers (environment: external)

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.0
          actions-cache-folder: 'emsdk-cache'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip
          pip install meson==1.10.0

      - name: Verify build tools installation
        run: |
          emcc --version
          meson --version
          ninja --version
          echo "EMSDK=$EMSDK"

      - name: Install pnpm dependencies (workspace packages)
        run: pnpm install --frozen-lockfile

      - name: Build WebCanvas (WASM + TypeScript)
        run: pnpm --filter @thorvg/webcanvas build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Playground
        run: |
          pnpm --filter playground build
          vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Playground Preview
        id: deploy-preview
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@v9
        with:
          script: |
            const header = '## Playground Preview';
            const body = `${header}\n\n🎮 Playground: ${{ steps.deploy-preview.outputs.preview_url }}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.findLast((c) =>
              c.user?.login === 'github-actions[bot]' && c.body?.includes(header));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated ${existing.html_url}`);
            } else {
              const res = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created ${res.data.html_url}`);
            }
